name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r api/requirements.txt httpx
      - run: python -m unittest discover -s tests -v

  rendered-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix demo-site
      - run: npm ci --prefix tools
      - run: ./tools/node_modules/.bin/playwright install --with-deps chromium
      - run: python -m tools.demo --rendered
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-verification-reports
          path: .sitegraph/workspaces/*/verification.json
          include-hidden-files: true
