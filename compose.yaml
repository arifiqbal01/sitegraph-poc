services:
  site:
    build:
      context: .
      dockerfile: Dockerfile.astro
    ports: ["4321:4321"]
  impact:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports: ["8000:8000"]
    volumes:
      - sitegraph_data:/app/data
    env_file:
      - path: .env
        required: false
volumes:
  sitegraph_data:
